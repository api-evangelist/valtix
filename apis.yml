aid: valtix
name: Valtix
description: Valtix is a multicloud network security platform delivering agentless, cloud-native firewalling — ingress
  WAF/IDS/IPS, egress TLS decryption and exfiltration prevention, and east-west inspection — across AWS, Azure,
  GCP, and OCI, driven by continuous cloud asset discovery and tag-based dynamic policy. Founded in 2018 and acquired
  by Cisco in 2023, the product is sold today as Cisco Multicloud Defense; the Valtix documentation site and the
  verified Terraform provider (valtix-security/valtix) remain live and actively maintained under the Valtix name,
  while the standalone website and commercial pages redirect to Cisco.
