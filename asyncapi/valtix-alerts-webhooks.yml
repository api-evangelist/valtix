notes: >-
  Valtix publishes no AsyncAPI. Its documented event surface is outbound: the
  Valtix Cloud Controller forwards user-defined system alerts (by event type
  and severity) to customer-configured webhook/API destinations via Alert
  Service Profiles + Alert Rules, and forwards traffic/security logs to SIEM
  destinations. Captured verbatim from the docs; no inbound webhook receiver
  is documented.
delivery_model: outbound alerts to customer-supplied webhook URLs / API keys
configuration: Administration -> Alert Profiles -> Services (+ Alert Rules)
