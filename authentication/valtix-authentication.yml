generated: '2026-07-21'
method: searched
source: https://docs.valtix.com/userguide/administration/roles/
docs: https://docs.valtix.com/userguide/
notes: >-
  Valtix publishes no OpenAPI; the supported programmatic interface is the
  verified Terraform provider (valtix-security/valtix), which authenticates to
  the Valtix Controller with a tenant API key file generated in the Valtix
  Portal. Portal/console access supports SSO (SAML via Okta, Azure AD,
  OneLogin), MFA, and mutual TLS, with three tenant roles.
summary:
  types: [apiKey]
  api_key_in: [file]
  oauth2_flows: []
schemes:
  - name: controller-api-key
    type: apiKey
    description: >-
      API key issued per Valtix tenant and downloaded as a JSON key file; used
      by the Terraform provider (api_key_file argument) to authenticate against
      the Valtix Controller.
    sources:
      - https://registry.terraform.io/providers/valtix-security/valtix/latest/docs
console:
  sso:
    - saml (Okta)
    - saml (Azure AD)
    - saml (OneLogin)
    - azure-ad-non-saml
  mfa: true
  mutual_tls: documented (userguide/administration/users/mtl/)
roles:
  - id: admin_super
    name: Super Admin
    permissions: Modify (all settings)
  - id: admin_rw
    name: Read/Write Admin
    permissions: Modify (except Super Admin management)
  - id: admin_read-only
    name: Read-Only Admin
    permissions: Read
