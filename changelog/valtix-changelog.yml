  - version: 26.5.1
    component: terraform-provider
    date: '2026-06-01'
    source: https://registry.terraform.io/providers/valtix-security/valtix/latest
    highlights:
      - Latest Terraform provider release published to the registry.
  - version: 25.8.1
    component: terraform-provider
    date: '2025-09-16'
    source: https://docs.valtix.com/releases/25.08/Terraform/
    highlights:
      - Adds Terraform support for integrating a Service vNet (valtix_service_vpc) with Azure vWAN vHub, peering and propagating spoke vNet CIDRs into vHub route tables.
      - Upgrades Terraform SDK to v2; provider now requires Terraform 0.12+.
      - Fixes valtix_service_object validation of overlapping ports across transport_mode port blocks.
    breaking: false
  - version: 25.5.1-25.5.5
    component: terraform-provider
    date: '2025-06-20'
    source: https://docs.valtix.com/releases/25.05/Terraform/
    highlights:
      - Adds Terraform support for Firewall Threat Defense Virtual (FTDv) Gateway (valtix_ftdv_gateway) resources, data source, and import.
      - Fixes valtix_profile_network_intrusion creation failing with "category app-detect is not valid".
      - Documentation formatting fixes (25.5.2-25.5.5).
    breaking: false
  - version: 25.4.1
    component: terraform-provider
    date: '2025-05-07'
    source: https://docs.valtix.com/releases/25.04/Terraform/
    highlights:
      - Adds M7i (2/4/8-core) instance type support for AWS Gateway (valtix_gateway) deployments.
      - Fixes ssh_public_key not being passed from provider to controller for new Gateway instances.
    breaking: false
